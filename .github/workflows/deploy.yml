name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.flag.outputs.present }}
    steps:
      - id: flag
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=${TOKEN:+yes}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: check-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # El adaptador @astrojs/cloudflare v13 exige un KV namespace SESSION.
      # Idempotente: crea solo si falta y parcha wrangler.jsonc con el id real.
      - name: Bootstrap KV SESSION
        if: needs.check-secret.outputs.present == 'yes'
        run: bash scripts/cf-setup.sh

      - name: Build (producción, adapter Cloudflare)
        run: pnpm run build:prod

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  preview:
    # PRs → versión preview, sin tocar producción
    if: needs.check-secret.outputs.present == 'yes' && github.event_name == 'pull_request'
    needs: [check-secret, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # El checkout es fresco: garantizar binding SESSION con id real aquí también.
      - name: Bootstrap KV SESSION
        run: bash scripts/cf-setup.sh

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload preview version
        id: upload
        run: |
          OUT="$(npx wrangler versions upload 2>&1)"
          echo "$OUT"
          URL="$(printf '%s\n' "$OUT" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)"
          echo "preview_url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test (preview)
        run: node scripts/smoke-test.mjs "${{ steps.upload.outputs.preview_url }}"

  production:
    # push a main / manual → producción. Única puerta a prod (PRD §5).
    if: >-
      needs.check-secret.outputs.present == 'yes' &&
      (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    needs: [check-secret, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Bootstrap KV SESSION
        run: bash scripts/cf-setup.sh

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy
        id: deploy
        run: |
          OUT="$(npx wrangler deploy 2>&1)"
          echo "$OUT"
          URL="$(printf '%s\n' "$OUT" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test (producción)
        run: node scripts/smoke-test.mjs "${{ steps.deploy.outputs.url }}"
